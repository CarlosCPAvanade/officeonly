version: '3.9'

services:
  database:
    image: mysql:8.4
    container_name: oo-database
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - onlyoffice-net

  api:
    image: localhost/onlyoffice-collab-api:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: oo-api
    restart: unless-stopped
    depends_on:
      - database
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=database;Port=3306;Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD};
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__Secret: ${JWT_SECRET}
      OnlyOffice__JwtSecret: ${ONLYOFFICE_JWT_SECRET}
      OnlyOffice__DocumentServerUrl: ${ONLYOFFICE_PUBLIC_URL}
      OnlyOffice__InternalDocumentServerUrl: ${ONLYOFFICE_INTERNAL_URL}
      OnlyOffice__InternalApiBaseUrl: ${API_INTERNAL_BASE_URL}
      OnlyOffice__PublicApiBaseUrl: ${API_PUBLIC_BASE_URL}
      Storage__RootPath: /app/data
      Seed__AdminUserName: ${SEED_ADMIN_USER}
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD}
    ports:
      - "5000:5000"
    volumes:
      - api_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - onlyoffice-net

  angular:
    image: localhost/onlyoffice-collab-angular:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        API_BASE_URL: ${API_PUBLIC_BASE_URL}
        ONLYOFFICE_URL: ${ONLYOFFICE_PUBLIC_URL}
    container_name: oo-angular
    restart: unless-stopped
    ports:
      - "4200:4200"
    networks:
      - onlyoffice-net

  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: oo-onlyoffice
    restart: unless-stopped
    environment:
      JWT_ENABLED: 'true'
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
      JWT_HEADER: Authorization
    ports:
      - "8080:80"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - onlyoffice-net

  nginx:
    image: nginx:1.27-alpine
    container_name: oo-nginx
    restart: unless-stopped
    depends_on:
      - angular
      - api
      - onlyoffice
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certbot/www:/var/www/certbot
      - ./docker/certbot/conf:/etc/letsencrypt
    networks:
      - onlyoffice-net

  certbot:
    image: certbot/certbot:latest
    container_name: oo-certbot
    profiles: ["prod"]
    volumes:
      - ./docker/certbot/www:/var/www/certbot
      - ./docker/certbot/conf:/etc/letsencrypt
    entrypoint: /bin/sh
    command: -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;"

volumes:
  mysql_data:
  api_data:
  onlyoffice_data:
  onlyoffice_logs:

networks:
  onlyoffice-net:
    driver: bridge
