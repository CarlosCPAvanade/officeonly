<section class="login-shell">
  <div class="login-card card">
    <h1>Acceso documental</h1>
    <p>Autenticación JWT para edición colaborativa con ONLYOFFICE.</p>

    <div class="demo-credentials">
      <strong>Credenciales de prueba</strong>
      <div><span>Usuario:</span> admin</div>
      <div><span>Contraseña:</span> ChangeThisAdminPassword!</div>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate autocomplete="off">
      <div class="field">
        <label for="userName">Usuario</label>
        <input id="userName" type="text" name="demo-username" formControlName="userName" placeholder="admin" autocomplete="off" autocapitalize="none" spellcheck="false" />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" name="demo-password" formControlName="password" placeholder="••••••••" autocomplete="new-password" />
      </div>

      <p class="error-text" *ngIf="errorMessage">{{ errorMessage }}</p>
      <button class="btn btn-primary" type="submit" [disabled]="loading">
        {{ loading ? 'Validando...' : 'Ingresar' }}
      </button>
    </form>
  </div>
</section>
